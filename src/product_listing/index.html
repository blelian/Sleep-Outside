<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Product Listing</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/product_listing.js" type="module"></script>
  </head>

  <body>
    <header class="divider">
      <div class="logo">
        <img src="/images/noun_Tent_2517.svg" alt="tent logo" />
        <a href="../index.html">Sleep<span class="highlight">Outside</span></a>
      </div>
      <div class="cart">
        <a href="../cart/index.html">Cart</a>
      </div>
    </header>

    <main class="divider">
      <section class="products">
        <h2 id="category-title">Top Products</h2>

        <!-- Search bar added here -->
        <input
          type="search"
          id="search-input"
          placeholder="Search products..."
          aria-label="Search products"
          style="margin-bottom: 1rem; padding: 0.5rem; width: 100%; max-width: 400px;"
        />

        <ul class="product-list"></ul>
      </section>
    </main>

    <footer>
      &copy;2025 ⛺ SleepOutside ⛺ WDD 330 ⛺ BYU-Idaho for BYU-Pathway Worldwide Online
    </footer>
  </body>
</html>
