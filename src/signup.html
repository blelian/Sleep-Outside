<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up | SleepOutside</title>
  <link rel="stylesheet" href="./css/signup.css" />
  <script type="module" src="./js/signup.js"></script>
</head>
<body>
  <main>
    <h1>Sign Up</h1>
    <p><a href="index.html" class="back-home-link">← Back to Home</a></p>
    <form class="signup-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required />

      <button type="submit">Create Account</button>
    </form>
    <!-- Info Modal -->
<div id="info-modal" class="info-modal">
  <div class="info-modal-content">
    <span id="close-info-modal" class="close">&times;</span>
    <h3>Why Sign Up?</h3>
    <p>Get exclusive camping deals, tips, and product updates right to your inbox!</p>
  </div>
</div>

    <!-- Modal -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span id="close-modal" class="close">&times;</span>
    <p id="modal-message"></p>
  </div>
</div>

<script type="module" src="../js/signup.js"></script>

  </main>

  <footer>
    &copy;2025 ⛺ SleepOutside ⛺ WDD 330 ⛺ BYU-Idaho for BYU-Pathway Worldwide Online
  </footer>
</body>
</html>
